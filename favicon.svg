<svg xmlns="http://www.w3.org/2000/svg" viewBox="100 100 824 824">
  <defs>
    <linearGradient id="matteGradient" x1="132" y1="116" x2="892" y2="916" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FCFDFD"/>
      <stop offset="0.52" stop-color="#E4E9EA"/>
      <stop offset="1" stop-color="#C4CED1"/>
    </linearGradient>
    <linearGradient id="waveGradient" x1="512" y1="236" x2="512" y2="788" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2FB3A2"/>
      <stop offset="1" stop-color="#06706B"/>
    </linearGradient>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="184" fill="url(#matteGradient)"/>
  <!-- Hairline rim: keeps the light card's edge on white backgrounds (Finder, Settings). -->
  <rect class="rim" x="101" y="101" width="822" height="822" rx="183" fill="none" stroke="#5E7378" stroke-width="2" opacity="0.28"/>
  <!-- Glyph bbox 532×552 ≈ 65–67% of the card; bars 84, gaps 28. -->
  <g id="wave" fill="url(#waveGradient)">
    <rect class="wave-bar" x="246" y="420" width="84" height="184" rx="42"/>
    <rect class="wave-bar" x="358" y="328" width="84" height="368" rx="42"/>
    <rect class="wave-bar" x="470" y="236" width="84" height="552" rx="42"/>
    <rect class="wave-bar" x="582" y="328" width="84" height="368" rx="42"/>
    <rect class="wave-bar" x="694" y="420" width="84" height="184" rx="42"/>
  </g>
</svg>
