<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Страница не найдена — VoiceGrep</title>
<!-- GitHub Pages serves this file for ANY missing path, at any depth, so nothing here may be
     relative: a relative favicon.svg under /a/b/ would resolve to /a/b/favicon.svg. Root paths
     (/, /en/, /favicon.svg) are right on voicegrep.com; on the github.io fallback (CNAME removed,
     see RELEASING.md) they point at the account root — this page then degrades to plain text.
     Colors mirror the landing's tokens; the theme follows the landing's stored choice. -->
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<script>
  try {
    var t = localStorage.getItem('vg.landing.theme');
    if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
  } catch (e) {}
</script>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f7f5f0; --card: #fffefb; --fg: #17181b; --muted: #66655f;
    --line: rgba(23,24,27,.11); --accent: #087a73;
    --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, "Segoe UI", Roboto, sans-serif;
    --serif: ui-serif, "New York", "Iowan Old Style", Georgia, "Times New Roman", serif;
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0e0f12; --card: #15171b; --fg: #f1f0ec; --muted: #a09e97;
      --line: rgba(255,255,255,.11); --accent: #3cc9bb;
    }
  }
  :root[data-theme="light"] { color-scheme: light; }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0e0f12; --card: #15171b; --fg: #f1f0ec; --muted: #a09e97;
    --line: rgba(255,255,255,.11); --accent: #3cc9bb;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 32px 16px;
    background: var(--bg); color: var(--fg); font: 17px/1.6 var(--sans);
    -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%; text-size-adjust: 100%;
  }
  main { width: 100%; max-width: 560px; }
  .brand { display: inline-flex; align-items: center; gap: 10px; font-weight: 700; font-size: 1.1rem; color: var(--fg); text-decoration: none; }
  .brand svg { border-radius: 8px; box-shadow: 0 1px 2px rgba(0,0,0,.12); }
  .code { font: 500 .85rem/1 var(--mono); color: var(--muted); margin: 36px 0 10px; }
  h1 { font-family: var(--serif); font-weight: 600; font-size: clamp(2rem, 7vw, 2.8rem); line-height: 1.08; letter-spacing: -.02em; margin: 0 0 .35em; }
  p { color: var(--muted); margin: 0 0 1.2em; }
  .links { display: flex; flex-wrap: wrap; gap: 10px; margin: 0 0 32px; }
  .btn {
    display: inline-flex; align-items: center; padding: .65em 1.2em; border-radius: 12px;
    font-weight: 650; text-decoration: none; background: var(--fg); color: var(--bg);
  }
  .btn.ghost { background: var(--card); color: var(--fg); border: 1px solid var(--line); }
  .en { border-top: 1px solid var(--line); padding-top: 24px; }
  .en h2 { font-size: 1.05rem; margin: 0 0 .3em; }
  a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
  <main>
    <a class="brand" href="/" aria-label="VoiceGrep — на главную">
      <svg width="30" height="30" viewBox="100 100 824 824" aria-hidden="true"><defs><linearGradient id="lg-m" x1="132" y1="116" x2="892" y2="916" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#FCFDFD"/><stop offset=".52" stop-color="#E4E9EA"/><stop offset="1" stop-color="#C4CED1"/></linearGradient><linearGradient id="lg-w" x1="512" y1="272" x2="512" y2="752" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#70D9C8"/><stop offset="1" stop-color="#078F88"/></linearGradient></defs><rect x="100" y="100" width="824" height="824" rx="184" fill="url(#lg-m)"/><g fill="url(#lg-w)"><rect x="284" y="432" width="72" height="160" rx="36"/><rect x="380" y="352" width="72" height="320" rx="36"/><rect x="476" y="272" width="72" height="480" rx="36"/><rect x="572" y="352" width="72" height="320" rx="36"/><rect x="668" y="432" width="72" height="160" rx="36"/></g></svg>
      VoiceGrep
    </a>
    <p class="code">404</p>
    <h1>Такой страницы нет</h1>
    <p>Возможно, ссылка устарела. Скачать VoiceGrep и прочитать, как он работает, можно на главной.</p>
    <div class="links">
      <a class="btn" href="/">На главную</a>
      <a class="btn ghost" href="/#faq">Вопросы и ответы</a>
    </div>
    <section class="en" lang="en">
      <h2>Page not found</h2>
      <p>The link may be out of date. Download VoiceGrep and see how it works on the home page.</p>
      <div class="links">
        <a class="btn ghost" href="/en/">Go to the English home page</a>
      </div>
    </section>
  </main>
</body>
</html>
